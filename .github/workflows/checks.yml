name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — tests y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas de comportamiento
        run: npm run test:ci
      - name: Comprobar TypeScript y compilar para producción
        run: npm run build
      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results.xml
          if-no-files-found: warn

  backend:
    name: Backend — tests y migraciones SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Pruebas con bases temporales y proveedores simulados, sin credenciales publicadas.
      DATABASE_SCHEMA: public
      IDENTITY_PROCESSOR: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Ejecutar pruebas y publicar resumen
        run: python run_tests.py
      - name: Validar generación SQL de las migraciones
        run: python -m alembic upgrade head --sql > migrations.sql
      - name: Guardar resultados y SQL generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-check-results
          path: |
            backend/test-results.txt
            backend/migrations.sql
          if-no-files-found: warn
