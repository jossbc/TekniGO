services:
  backend:
    build:
      context: ./backend
    image: teknigo-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

    environment:
      IDENTITY_PROCESSOR: http
      IDENTITY_SERVICE_URL: http://identity:8001/evaluate
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:?Set IDENTITY_SERVICE_TOKEN in the shell}
    depends_on:
      - identity
    networks:
      - default
      - identity

  identity:
    build:
      context: ./backend
      dockerfile: Dockerfile.identity
    image: teknigo-identity
    environment:
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:?Set IDENTITY_SERVICE_TOKEN in the shell}
    networks:
      - identity

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    image: teknigo-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
networks:
  identity:
    internal: true
