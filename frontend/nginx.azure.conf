server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # En Azure Container Apps el frontend consume directamente la URL HTTPS del backend
    # inyectada en VITE_API_URL (/notifications, /reviews, /chat, /service-requests, /incident-tickets, etc.),
    # sin depender de upstream backend:8000. Las rutas de la SPA resuelven a index.html.
    location = /version.txt {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
