server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /version.txt {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
